# xmad/3_iteration/runs.yaml
#
# RUN IDs ARE FIXED (last renumbering 2026-10-06, before the first scored run):
# P3-001 ... are the names of the result folders (results/<run_id>_<label>[_rep<n>]/).
# Do not renumber. New runs are appended at the end with the next free ID.
#
# All planned Phase 3 runs, listed explicitly so the plan can be read (and
# ticked off) as it is. Built from the blocks below and models.yaml; `gpus` is
# the GPU need of the run (sum of the two models' tensor-parallel sizes).
#
# Common to every run (unchanged from Phase 2 unless noted):
#   * HotpotQA distractor, validation split, the SAME 1000 questions as Phase 2
#     (random sample, seed 42 -- verified to reproduce the Phase 2 indices)
#   * identical debate system prompt and judge prompt (prompts/, copied
#     unchanged from 2_iteration/prompts/)
#   * temperature 0.0, top_p 1.0, max_tokens 8192; every vLLM server started with
#     --generation-config vllm (no model-specific sampling defaults); reasoning
#     switched off for every debater (models.yaml)
#   * max 10 rounds, stalemate_patience 1, forced first search in round 1
#   * one fixed judge for all runs: deepseek-v4-flash, run as a separate pass
#     after the debates (phase3.py judge), so it never needs GPUs during a run
#   * a homogeneous pair (A x A) runs both agents on ONE server, as in Phase 2;
#     a heterogeneous pair needs gpus(A) + gpus(B) <= 8 GPUs on one node (C1.2)
#
# Why the homogeneous block A: every model's self-pair gives (1) its matched
# single-agent baseline (independent round-1 answer), (2) its noise floor and
# (3) its individual ability. A heterogeneous pair's gain is read against the
# better of its two self-pairs, so no pair is interpretable without them.
#
# pair_type: DxD dense+dense, MxM MoE+MoE, DxM dense+MoE.
#
# Execution: one node, 8 GPUs; phase3.py run packs as many runs side by side
# as the free GPUs allow, in the order of this file.
#
# Counts: 85 runs = 22 homogeneous + 57 heterogeneous + 6 replicates
#   by priority: must 51, should 25, could 9
#   cumulative:  must 51, +should 76, +could 85
#   heterogeneous by pair type: DxD 19, MxM 11, DxM 27
#
# Heatmap matrices (complete, every cell run):
#   ~30B cross-vendor 6x6: qwen3.5-27b, gemma4-31b, muse-glimmer-30b | qwen3.5-35b-a3b, gemma4-26b-a4b, nemotron3-nano-30b-a3b
#   Qwen3.5 ladder    6x6: qwen3.5-4b, -9b, -27b, -35b-a3b, -122b-a10b, -397b-a17b
#   large tier        4x4: llama3.3-70b | qwen3.5-122b-a10b, mistral-small4-119b, nemotron3-super-120b-a12b
#
# Rough runtime per 1000 questions (from Phase 1/2: 7B pair ~0.3-0.5 h): small/medium
# pairs ~0.5-1.5 h, large pairs ~2-4 h (estimate, to be replaced by measured values).

sample:
  dataset: hotpotqa/hotpot_qa
  config: distractor
  split: validation
  n_questions: 1000
  seed: 42
blocks:
  A_homogeneous:
    priority: 'per model: highest priority of the pairs it appears in'
    description: Self-pair of every model in models.yaml.
  F_anchor:
    priority: must
    description: Phase 2 heterogeneous pair re-run on the new vLLM stack (anchor for comparing stacks).
  B_within_vendor_dense_x_moe:
    priority: must
    description: Dense x MoE with the vendor held fixed -- the cleanest dense-vs-MoE contrast.
  C_cross_vendor_M:
    priority: must
    description: '~30B tier, different vendors: every dense/MoE combination of {Qwen3.5-27B, Gemma4-31B,
      Muse-30B} (dense) and {Qwen3.5-35B-A3B, Gemma4-26B-A4B, Nemotron3-Nano-30B-A3B} (MoE).'
  C_cross_vendor_L:
    priority: should
    description: 'Large tier, different vendors: dense {Llama-3.3-70B} and MoE {Qwen3.5-122B-A10B, Mistral-Small4-119B,
      Nemotron3-Super-120B} (MoEs of matched total size ~110-120B).'
  C_cross_vendor_S:
    priority: could
    description: Small tier, different vendors -- dense x dense only (no small MoE exists); control for
      the vendor effect without any routing difference.
  D_size_qwen:
    priority: must
    description: 'Size ladder within Qwen3.5 (as in the Phase 1 sweep): small+small, small+large, large+large,
      crossed with dense/MoE.'
  D_size_qwen_complete:
    priority: should
    description: Completes the Qwen3.5 ladder to a full 6x6 matrix (heatmap) together with D_size_qwen
      and qwen3.5-27b x qwen3.5-35b-a3b from block B.
  D_size_gemma:
    priority: should
    description: Size ladder within Gemma 4.
  D_size_mistral:
    priority: should
    description: Size ladder within Mistral.
  D_size_nvidia:
    priority: should
    description: Size ladder within Nemotron.
  D_size_meta:
    priority: could
    description: Size ladder within Meta, dense only (spans three model generations -- disclosed).
  D_generation_qwen:
    priority: could
    description: Same size and routing, two Qwen generations (3.5 vs 3.8).
  R_replicates:
    priority: must
    description: 'Two repeats (replicate 2 and 3) of three cheap homogeneous runs (qwen3.5-9b, qwen3.5-35b-a3b,
      gemma4-31b): run-to-run noise from GPU non-determinism, used as the significance threshold in the
      heatmaps.'
