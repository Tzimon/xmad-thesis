# xmad/4_iteration/models.yaml
#
# COPIED FROM 3_iteration/models.yaml (model registry = configuration, not results).
# Phase 4 uses a subset of these models (runs.yaml). The `excluded` entries are
# FINDINGS OF PHASE 3 (smoke test / pre-test there) and are carried over as prior
# knowledge; Phase 4 does not re-test the excluded models. Every model that
# Phase 4 runs gets its own smoke test in 4_iteration/smoke/ before it is used.
#
# Phase 3 model list. Selection principle (PLAN, 2026-10-05):
#   * Focus: dense vs. Mixture-of-Experts (MoE).
#   * Few vendors, but each one deep: several sizes per vendor, and a dense
#     and an MoE model in the same vendor wherever one exists, so dense vs.
#     MoE can be compared with the vendor held fixed.
#   * Five vendors: Alibaba (Qwen), Google (Gemma 4), Mistral, NVIDIA
#     (Nemotron), Meta (Llama / Muse; dense only, see 'Not included').
#   * Attention / sequence-mixer type is RECORDED (field `mixer`) for the
#     analysis but was NOT a selection criterion.
#   * Every model must fit, together with its debate partner, on ONE node with
#     8x H200 (141 GB each, ~1128 GB total) -- requirement C1.2.
#
# Field reference
#   hf_id            Hugging Face repo that download_models.py fetches
#   hf_id_verified   true = repo id confirmed on recipes.vllm.ai (2026-10-05);
#                    false = still to be checked (download_models.py --check)
#   vendor / family  developer and model family
#   release          YYYY-MM (approximate where only the year is known)
#   ffn              dense | moe
#   params_total_b / params_active_b   in billions (active == total for dense)
#   tier             S (<= 15B total), M (25-35B), L (>= 70B)
#   mixer            recorded only: full_gqa | swa_global | gdn_hybrid |
#                    mamba2_hybrid | sparse_hybrid
#   dtype            precision to serve; all L-tier models whose vendor ships
#                    an official FP8 checkpoint are served in FP8 (needed to
#                    fit two large models on one node). Disclosed confound.
#   gpus             tensor-parallel size on H200 incl. KV-cache headroom
#   disk_gb          approximate checkpoint size (download planning only)
#   ignore           extra ignore patterns for the download
#   tool_call_parsers  vLLM --tool-call-parser candidates; smoke_test.py tries
#                    them in order and records the first that works
#   vllm_args        extra `vllm serve` flags (from the vLLM recipes). Paths
#                    "templates/..." are relative to 3_iteration/; "hf:<file>"
#                    is a file inside the model's HF snapshot. The launcher
#                    always adds --generation-config vllm (no model sampling
#                    defaults), --tensor-parallel-size <gpus>, --seed 0.
#   request_extra_body / system_prompt_suffix
#                    reasoning switched OFF for every debating agent. Preferred
#                    server-side (--default-chat-template-kwargs in vllm_args),
#                    else per request, else -- only Muse --
#                    as a line appended to the system prompt (disclosed deviation).
#   role             anchor (Phase 2 model) | judge (not a debater)
#   excluded         reason why the model is not used (its runs show as "blocked")
#
# Not included, and why
#   Qwen3.8-2.4T-A95B   ~2.4 TB even in FP8 > one node (~1.13 TB); would need 3 nodes alone.
#   Mistral-Large-3-675B-A41B, Nemotron-3-Ultra-550B-A55B, DeepSeek-V4.1-Flash
#                       fill a whole node alone -> no room for the debate partner.
#   Mistral-Medium-3.5-128B  needs a vLLM nightly build (no stable release yet);
#                       dropped to keep the setup on one stable vLLM version.
#   Llama-4-Scout / Maverick (Meta's only open MoEs) are natively multimodal; the
#                       Llama 4 license does not grant the rights for its multimodal
#                       models to individuals domiciled / companies based in the EU.
#                       Meta therefore contributes dense models only.
#   Nemotron-Nano-9B-v2 its tool-call parser plugin (nemotron_json, 2025) does not
#                       load in vLLM 0.31 (smoke test 2026-10-05); replaced by the
#                       same-generation dense Nemotron-3-Nano-4B.
#   Muse Spark 1.2      open weights announced (Aug 2026) but not published.
#   gpt-oss, DeepSeek   MoE only (no dense counterpart from the same vendor);
#                       not used as debaters. DeepSeek-V4-Flash is the JUDGE (below):
#                       a strong model from a family that does not debate.

