# xmad/4_iteration/runs.yaml
#
# All planned Phase 4 runs. GENERATED from 3_iteration/runs.yaml (decision 2026-10-24):
# every Phase 3 pair once per benchmark, so that each pair can be compared across
# HotpotQA (Phase 3), MuSiQue and 2WikiMultiHopQA.
#   * left out: the 6 replicate runs of Phase 3 (run-to-run noise is known from Phase 3,
#     <= 0.1 pp EM, same stack and hardware) and the 13 runs with the two Nemotron MoE
#     models excluded in Phase 3 (models.yaml -> excluded)
#   * 66 runs per benchmark = 20 homogeneous + 46 mixed; 132 runs in total
#   * RUN IDs: P4-MSQ-nnn (MuSiQue) and P4-2WK-nnn (2Wiki); the SAME nnn is the SAME pair
#     on both benchmarks; p3_run_id names the corresponding Phase 3 run (HotpotQA)
#   * priorities as in Phase 3; file order = priority, then MuSiQue, then 2Wiki, so that
#     the must-runs of both benchmarks finish first if time runs short
#   * P4-HPQ-001 (priority "manual"): regression check of the harness against P3-001;
#     never started by `run --priority ...`, only by `run --only P4-HPQ-001 --n 30`
#
# Counts per benchmark: must 38, should 19, could 9 (= 66); MuSiQue + 2Wiki = 132, plus P4-HPQ-001
#         homogeneous runs (MuSiQue + 2Wiki): 40
#
# Common to every run (config/base.yaml): unchanged Phase 3 conditions -- temperature 0.0,
# top_p 1.0, max_tokens 8192, reasoning off, max 10 rounds, stalemate_patience 1, forced
# first search, k = 3 passages per search, judge deepseek-v4-flash as a separate pass.
# Per benchmark: the same random sample of 1000 questions (seed 42) for every pair.

